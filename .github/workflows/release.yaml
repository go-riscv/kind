name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-riscv
    env:
      REGISTRY: ghcr.io/go-riscv
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      K9S_SOURCE_DIR: ${{ github.workspace }}/_deps/k9s
      BUILDX_CONTAINER_CACHE_ARGS: >-
        --cache-from type=gha,scope=release-images-riscv64
        --cache-to type=gha,scope=release-images-riscv64,mode=max
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Checkout k9s source
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v0.50.18 https://github.com/derailed/k9s.git _deps/k9s

      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Restore Go build caches
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-riscv64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-riscv64-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate build environment
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          make --version
          git --version

      - name: Verify CI baseline optimization contract
        run: make verify-ci-baseline-optimization

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release images
        run: make release-build-images

      - name: Build release binaries
        run: make release-build-binaries

      - name: Stage release assets
        run: make release-checksums

      - name: Retag and push release images
        run: make release-push-images

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/kind-linux-riscv64
            dist/release/kubectl-linux-riscv64
            dist/release/kubeadm-linux-riscv64
            dist/release/k9s-linux-riscv64
            dist/release/SHA256SUMS
          body: |
            Published riscv64 release assets:
            - kind-linux-riscv64
            - kubectl-linux-riscv64
            - kubeadm-linux-riscv64
            - k9s-linux-riscv64
            - SHA256SUMS

            Published images:
            - ghcr.io/go-riscv/kube-cross-riscv64:${{ github.ref_name }}
            - ghcr.io/go-riscv/debian-base-riscv64:${{ github.ref_name }}
            - ghcr.io/go-riscv/go-runner-riscv64:${{ github.ref_name }}
            - ghcr.io/go-riscv/setcap-riscv64:${{ github.ref_name }}
            - ghcr.io/go-riscv/distroless-iptables-riscv64:${{ github.ref_name }}
            - ghcr.io/go-riscv/pause:${{ github.ref_name }}
            - ghcr.io/go-riscv/local-path-helper:${{ github.ref_name }}
            - ghcr.io/go-riscv/local-path-provisioner:${{ github.ref_name }}
            - ghcr.io/go-riscv/base:${{ github.ref_name }}
            - ghcr.io/go-riscv/kindnetd:${{ github.ref_name }}
            - ghcr.io/go-riscv/node:${{ github.ref_name }}
