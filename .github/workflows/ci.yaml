name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run a kind create cluster smoke test after the local build"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-build:
    runs-on: ubuntu-24.04-riscv
    env:
      REGISTRY: ghcr.io/go-riscv
      BUILDX_CONTAINER_CACHE_ARGS: >-
        --cache-from type=gha,scope=release-images-riscv64
        --cache-to type=gha,scope=release-images-riscv64,mode=max
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_REF}"
          fi
          git checkout --force FETCH_HEAD

      - name: Restore Go build caches
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-riscv64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-riscv64-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate build environment
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          make --version
          git --version
          go version

      - name: Verify repository contracts
        run: |
          hack/ci/test-release-identity.sh
          hack/ci/test-build-orchestration.sh
          hack/ci/test-minimum-surface.sh
          hack/ci/test-upstream-patches.sh

      - name: Build local development images
        run: make dev-build-images

      - name: Build local development binaries
        run: make dev-build-binaries

      - name: Stage and checksum development artifacts
        run: make dev-checksums

      - name: Verify release asset names
        run: |
          set -euo pipefail
          test -x dist/release/kind-linux-riscv64
          test -x dist/release/kubectl-linux-riscv64
          test -x dist/release/kubeadm-linux-riscv64
          test -f dist/release/kind-config-linux-riscv64.yaml
          test -x dist/release/verify-kind-release-riscv64.sh
          (cd dist/release && sha256sum -c SHA256SUMS)

      - name: Verify local image contract
        run: hack/ci/verify-kind-image-contract.sh local

      - name: Upload local release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riscv64-release-assets
          path: |
            dist/release/kind-linux-riscv64
            dist/release/kubectl-linux-riscv64
            dist/release/kubeadm-linux-riscv64
            dist/release/kind-config-linux-riscv64.yaml
            dist/release/verify-kind-release-riscv64.sh
            dist/release/SHA256SUMS

      - name: Optional kind cluster smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
        run: |
          hack/ci/kind-smoke.sh
          hack/ci/kind-ha-smoke.sh
